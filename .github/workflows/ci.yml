name: CI

on:
  push:
  pull_request:

jobs:
  server:
    name: server tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  server-postgres:
    name: server tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smile
          POSTGRES_DB: smile
          # A throwaway database inside the CI runner: no password needed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smile"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-prod.txt
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql://smile@localhost:5432/smile

  server-image:
    name: server container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image the cloud will run
        run: docker build -t smile-ai-server server
      - name: Start it and call the API
        run: |
          docker run -d --name smile -p 8000:8000 smile-ai-server
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/config
          curl -sf http://127.0.0.1:8000/businesses | python3 -c "import json, sys; assert len(json.load(sys.stdin)) == 12"
      - if: failure()
        run: docker logs smile

  app:
    name: app analyze, tests, web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      # CanvasKit is served with the app instead of a CDN, so the web app has no outside dependencies.
      - run: flutter build web --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: smile-ai-web
          path: app/build/web
          retention-days: 14

  e2e:
    name: app + server end-to-end (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smile
          POSTGRES_DB: smile
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smile"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Start the server
        working-directory: server
        env:
          DATABASE_URL: postgresql://smile@localhost:5432/smile
        run: |
          pip install -r requirements.txt -r requirements-prod.txt
          nohup uvicorn app.main:app --port 8000 > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
      - name: Run the app's data layer and blocs against it
        working-directory: app
        run: |
          flutter pub get
          flutter test tool/e2e
      - if: failure()
        run: cat /tmp/server.log

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # The same kind of build the Release workflow publishes, so a release cannot fail on it.
      - name: Build the release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: smile-ai-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --no-codesign
