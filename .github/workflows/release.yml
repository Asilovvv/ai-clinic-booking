name: Release

# Builds the app that talks to the cloud server and publishes it:
#   - an Android APK attached to a GitHub Release (install once, it keeps working);
#   - the web app on GitHub Pages (on an iPhone: open the link in Safari and
#     "Add to Home Screen").
#
# Before the first run (see docs/DEPLOY.md):
#   1. Deploy the server. Its address is typed in when the workflow is started, or kept in the
#      repository variable API_URL (Settings > Secrets and variables > Actions > Variables).
#   2. For the web app turn on Pages: Settings > Pages > Source: GitHub Actions.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag of the release, for example v3.0.0"
        required: true
        default: v3.0.0
      api_url:
        description: "Address of the cloud server (empty: the repository variable API_URL)"
        required: false
        default: https://smile-ai-api.onrender.com
      web:
        description: "Also publish the web app on GitHub Pages"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

env:
  API_URL: ${{ inputs.api_url || vars.API_URL }}

jobs:
  check:
    name: the server answers
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Type the server address into api_url, or set the repository variable API_URL (docs/DEPLOY.md)."
            exit 1
          fi
          # A free cloud server may need up to a minute to wake up.
          for i in 1 2 3 4; do
            curl -sf --max-time 90 "${API_URL%/}/health" && exit 0
            sleep 10
          done
          echo "::error::${API_URL%/}/health does not answer."
          exit 1

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=API_URL="$API_URL"
      - run: mv build/app/outputs/flutter-apk/app-release.apk "build/smile-ai-${{ inputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/smile-ai-${{ inputs.version }}.apk
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="build/smile-ai-${{ inputs.version }}.apk"
          notes="Smile AI ${{ inputs.version }}. Install the APK once: the app talks to the cloud server at $API_URL."
          gh release create "${{ inputs.version }}" "$apk" --target "${{ github.sha }}" \
            --title "Smile AI ${{ inputs.version }}" --notes "$notes" \
            || gh release upload "${{ inputs.version }}" "$apk" --clobber

  web:
    name: web app on GitHub Pages
    if: ${{ inputs.web }}
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: app
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn \
            --base-href "/${{ github.event.repository.name }}/" --dart-define=API_URL="$API_URL"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web
      - id: deploy
        uses: actions/deploy-pages@v4
