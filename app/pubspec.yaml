name: ai_clinic
description: "Smile AI - booking for any local service: a catalog and an AI administrator for clients, a cabinet for business owners."
publish_to: 'none'
version: 3.0.0+3

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  equatable: ^2.0.5
  http: ^1.2.2
  shared_preferences: ^2.3.2
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  # The same typeface on Android, iOS and Web; the web app does not fetch it from a CDN.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Black.ttf
          weight: 900

# App icon: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#0E9F8E"
    theme_color: "#0E9F8E"
