name: ai_clinic
description: "Smile AI - AI administrator that books a dentist, a barber or a car service from one sentence."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  equatable: ^2.0.5
  http: ^1.2.2
  shared_preferences: ^2.3.2
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# App icon: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#0E9F8E"
    theme_color: "#0E9F8E"
